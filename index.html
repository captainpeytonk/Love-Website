<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Made with Love</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      padding: 40px 20px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    h1 {
      color: #fff;
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    label {
      display: block;
      font-size: 1.2em;
      color: #fff;
      margin-bottom: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      font-size: 1.1em;
      text-align: center;
      margin-bottom: 20px;
    }
    .submit-btn {
      background: linear-gradient(45deg, #d63384, #f8d7da);
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(214, 51, 132, 0.4);
    }
    .error {
      color: #fff;
      background: rgba(220, 53, 69, 0.8);
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 10px;
    }
    /* Popup styles */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .popup-content h2 {
      color: #28a745;
      margin-bottom: 15px;
      font-size: 1.8em;
    }
    .popup-content p {
      color: #495057;
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    .enter-btn {
      background: #28a745;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .enter-btn:hover {
      background: #218838;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Made with Love</h1>
    <label for="nameInput">What is your name?</label>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button class="submit-btn" onclick="checkName()">Submit</button>
    <div id="errorMessage" class="error" style="display:none;"></div>
  </div>

  <!-- Success Popup -->
  <div class="popup" id="successPopup">
    <div class="popup-content">
      <h2>That is correct :)</h2>
      <p>Welcome! Click below to continue.</p>
      <button class="enter-btn" onclick="goToSelect()">Enter</button>
    </div>
  </div>

  <script>
    function checkName() {
      const nameInput = document.getElementById('nameInput');
      const errorMessage = document.getElementById('errorMessage');
      const name = nameInput.value.trim().toLowerCase();
      
      if (name === 'peyton' || name === 'tara') {
        document.getElementById('successPopup').style.display = 'flex';
        errorMessage.style.display = 'none';
        nameInput.value = '';
      } else {
        errorMessage.textContent = 'Sorry, that name is not recognized. Try again!';
        errorMessage.style.display = 'block';
      }
    }

    function goToSelect() {
      window.location.href = "select.html"; // ✅ opens in same tab
    }

    // Allow Enter key
    document.getElementById('nameInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkName();
    });
  </script>
</body>
</html>
