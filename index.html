<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Made with Love</title>
  <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 40px 20px;
        }

        h1 {
            color: #ffffff;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            font-weight: bold;
        }

        .login-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 1.3em;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1.1em;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #d63384;
            box-shadow: 0 0 10px rgba(214, 51, 132, 0.2);
        }

        .submit-btn {
            background: linear-gradient(45deg, #d63384, #f8d7da);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.4);
    }
    .error {
      color: #fff;
      background: rgba(220, 53, 69, 0.8);
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 10px;
    }
    /* Popup styles */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .popup-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .popup-content h2 {
            color: #28a745;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .popup-content p {
            color: #495057;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
    .enter-btn {
      background: #28a745;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .enter-btn:hover {
      background: #218838;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Made with Love</h1>
    <label for="nameInput">What is your name?</label>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button class="submit-btn" onclick="checkName()">Submit</button>
    <div id="errorMessage" class="error" style="display:none;"></div>
  </div>

  <!-- Success Popup -->
  <div class="popup" id="successPopup">
    <div class="popup-content">
      <h2>That is correct :)</h2>
      <p>Welcome! Click below to continue.</p>
      <button class="enter-btn" onclick="goToSelect()">Enter</button>
    </div>
  </div>

  <script>
    function checkName() {
      const nameInput = document.getElementById('nameInput');
      const errorMessage = document.getElementById('errorMessage');
      const name = nameInput.value.trim().toLowerCase();
      
      if (name === 'peyton' || name === 'tara') {
        document.getElementById('successPopup').style.display = 'flex';
        errorMessage.style.display = 'none';
        nameInput.value = '';
      } else {
        errorMessage.textContent = 'Sorry, that name is not recognized. Try again!';
        errorMessage.style.display = 'block';
      }
    }

    function goToSelect() {
      window.location.href = "select.html"; // ✅ opens in same tab
    }

    // Allow Enter key
    document.getElementById('nameInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkName();
    });
  </script>
</body>
</html>
