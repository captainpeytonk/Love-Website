<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made with Love</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 40px 20px;
        }

        h1 {
            color: #ffffff;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            font-weight: bold;
        }

        .login-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 1.3em;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1.1em;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #d63384;
            box-shadow: 0 0 10px rgba(214, 51, 132, 0.2);
        }

        .submit-btn {
            background: linear-gradient(45deg, #d63384, #f8d7da);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.4);
        }

        .activities-section {
            display: none;
            margin-top: 30px;
        }

        .welcome-message {
            font-size: 1.4em;
            color: #ffffff;
            margin-bottom: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .activities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .activity-btn {
            background: linear-gradient(45deg, #ffc107, #ffeb3b);
            border: none;
            padding: 15px 10px;
            border-radius: 15px;
            color: #495057;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
            text-decoration: none;
            display: block;
        }

        .activity-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);
            background: linear-gradient(45deg, #ffca28, #fff176);
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .popup-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .popup-content h2 {
            color: #28a745;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .popup-content p {
            color: #495057;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #28a745;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .error {
            color: #ffffff;
            background: rgba(220, 53, 69, 0.8);
            font-size: 0.9em;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .activities-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Made with Love</h1>
        
        <div class="login-section" id="loginSection">
            <label for="nameInput">What is your name?</label>
            <input type="text" id="nameInput" placeholder="Enter your name">
            <button class="submit-btn" onclick="checkName()">Submit</button>
            <div id="errorMessage" class="error" style="display: none;"></div>
        </div>

        <div class="activities-section" id="activitiesSection">
            <div class="welcome-message">
                Here we have some different activities to choose from!
            </div>
            
            <div class="activities-grid">
                <a href="#" class="activity-btn" onclick="openActivity('activity1')">Travel Map</a>
                <a href="#" class="activity-btn" onclick="openActivity('activity2')">Timeline</a>
                <a href="#" class="activity-btn" onclick="openActivity('activity3')">Bucket List</a>
                <a href="#" class="activity-btn" onclick="openActivity('activity4')">Food</a>
                <a href="#" class="activity-btn" onclick="openActivity('activity5')">Garden</a>
                <a href="#" class="activity-btn" onclick="openActivity('activity6')">Watchlist</a>
                <a href="#" class="activity-btn" onclick="openActivity('activity7')">Music Playlist</a>
                <a href="#" class="activity-btn" onclick="openActivity('activity8')">Future Plans</a>
            </div>
        </div>
    </div>

    <!-- Success Popup -->
    <div class="popup" id="successPopup">
        <div class="popup-content">
            <h2>That is correct :)</h2>
            <p>Here we have some different activities to choose from!</p>
            <button class="close-btn" onclick="closePopup()">Continue</button>
        </div>
    </div>

    <script>
        // Activity links - updated with your actual URLs
        const activityLinks = {
            activity1: 'map.html',            
            activity2: 'timer.html',
            activity3:  'bucket.html',
            activity4:  'Foodie.html',
            activity5:  'living garden.html',      
            activity6: 'Watched.html',                         
            activity7: 'https://open.spotify.com/playlist/1KG6OBFqUN9vmxYVU6H6R0?si=H5QMngj0TlSCZVhospDUCQ&pi=sD2VT7PcSz2fp',                    
            activity8: ''                     
        };

        function checkName() {
            const nameInput = document.getElementById('nameInput');
            const errorMessage = document.getElementById('errorMessage');
            const name = nameInput.value.trim().toLowerCase();
            
            if (name === 'peyton' || name === 'tara') {
                // Show success popup
                document.getElementById('successPopup').style.display = 'flex';
                errorMessage.style.display = 'none';
                nameInput.value = '';
            } else {
                errorMessage.textContent = 'Sorry, that name is not recognized. Try again!';
                errorMessage.style.display = 'block';
            }
        }

        function closePopup() {
            document.getElementById('successPopup').style.display = 'none';
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('activitiesSection').style.display = 'block';
        }

function openActivity(activityId) {
    const url = activityLinks[activityId];
    if (url && url.startsWith('http')) {
        // Open external links in a new tab
        window.open(url, '_blank');
    } else if (url) {
        // Normal page navigation
        window.location.href = url;
    } else {
                alert('Please add your link for this activity in the JavaScript code!');
            }
        }

        // Allow Enter key to submit
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkName();
            }
        });
    </script>
</body>
</html>
