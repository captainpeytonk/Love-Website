  function openActivity(activityId) {
    const url = activityLinks[activityId];
    if (url && url.startsWith('http')) {
        // Open external links in a new tab
        window.open(url, '_blank');
    } else if (url) {
        // Normal page navigation
        window.location.href = url;
    } else {
