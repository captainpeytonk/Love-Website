<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Watchlist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .watchlist {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .show-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .show-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
        }

        .show-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #4a5568;
        }

        .drawing-preview {
            width: 100%;
            height: 150px;
            border: 2px dashed #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #f7fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .drawing-preview:hover {
            border-color: #667eea;
        }

        .drawing-preview canvas {
            border-radius: 8px;
            max-width: 100%;
            max-height: 100%;
        }

        .edit-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.3s ease;
        }

        .edit-btn:hover {
            background: #5a67d8;
        }

        .add-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .add-button:hover {
            background: #38a169;
            transform: scale(1.1);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 2% auto;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #667eea;
        }

        .input-section {
            margin-bottom: 25px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .drawing-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-group label {
            font-weight: 600;
            color: #4a5568;
            margin: 0;
        }

        .color-picker {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .size-slider {
            width: 100px;
        }

        .tool-button {
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tool-button:hover, .tool-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .drawing-canvas {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: crosshair;
            display: block;
            margin: 0 auto 20px auto;
            background: white;
        }

        .canvas-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .save-btn {
            background: #48bb78;
            color: white;
        }

        .save-btn:hover {
            background: #38a169;
        }

        .clear-btn {
            background: #f56565;
            color: white;
        }

        .clear-btn:hover {
            background: #e53e3e;
        }

        .cancel-btn {
            background: #a0aec0;
            color: white;
        }

        .cancel-btn:hover {
            background: #718096;
        }

        .empty-state {
            text-align: center;
            color: white;
            margin-top: 50px;
        }

        .empty-state p {
            font-size: 1.2em;
            margin-bottom: 20px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 What We Watched 🎬</h1>
        
        <div class="watchlist" id="watchlist">
            <!-- Shows will be dynamically added here -->
        </div>

        <div class="empty-state" id="emptyState">
            <p>No shows or movies added yet!</p>
            <p>Click the + button to add your first one 😊</p>
        </div>

        <button class="add-button" id="addButton">+</button>
    </div>

    <!-- Modal for adding/editing shows -->
    <div id="showModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2 id="modalTitle">Add New Show/Movie</h2>
            
            <div class="input-section">
                <input type="text" id="showName" placeholder="Enter the name..." />
            </div>

            <div class="input-section">
                <label for="typeSelect">Type:</label>
                <select id="typeSelect" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1em;">
                    <option value="movie">Movie</option>
                    <option value="show">Show</option>
                </select>
            </div>

            <div class="input-section" id="statusSection" style="display: none;">
                <label for="statusSelect">Status:</label>
                <select id="statusSelect" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1em;">
                    <option value="ongoing">Ongoing</option>
                    <option value="finished">Finished</option>
                </select>
            </div>

            <div class="input-section">
                <label for="description">Description (optional):</label>
                <textarea id="description" placeholder="Add any notes or memories..." style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1em; min-height: 80px; resize: vertical; font-family: inherit;"></textarea>
            </div>

            <div class="drawing-tools">
                <div class="tool-group">
                    <label>Color:</label>
                    <input type="color" id="colorPicker" class="color-picker" value="#000000" />
                </div>
                
                <div class="tool-group">
                    <label>Size:</label>
                    <input type="range" id="sizeSlider" class="size-slider" min="1" max="50" value="5" />
                    <span id="sizeDisplay">5</span>
                </div>
                
                <div class="tool-group">
                    <button id="penTool" class="tool-button active">✏️ Pen</button>
                    <button id="eraserTool" class="tool-button">🧹 Eraser</button>
                    <button id="fillTool" class="tool-button">🪣 Fill</button>
                </div>
            </div>

            <canvas id="drawingCanvas" class="drawing-canvas" width="600" height="400"></canvas>

            <div class="canvas-actions">
                <button class="action-btn clear-btn" id="clearCanvas">Clear</button>
                <button class="action-btn cancel-btn" id="cancelBtn">Cancel</button>
                <button class="action-btn save-btn" id="saveShow">Save</button>
            </div>
        </div>
    </div>

    <script>
        class WatchlistApp {
            constructor() {
                this.shows = [];
                this.currentShowIndex = -1;
                this.isDrawing = false;
                this.currentTool = 'pen';
                this.currentColor = '#000000';
                this.currentSize = 5;
                
                this.canvas = document.getElementById('drawingCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.setupEventListeners();
                this.loadShowsFromBlob();
                this.updateDisplay();
            }

            setupEventListeners() {
                // Modal controls
                document.getElementById('addButton').addEventListener('click', () => this.openModal());
                document.getElementById('closeModal').addEventListener('click', () => this.closeModal());
                document.getElementById('cancelBtn').addEventListener('click', () => this.closeModal());
                document.getElementById('saveShow').addEventListener('click', () => this.saveShow());

                // Drawing tools
                document.getElementById('colorPicker').addEventListener('change', (e) => {
                    this.currentColor = e.target.value;
                });

                document.getElementById('sizeSlider').addEventListener('input', (e) => {
                    this.currentSize = e.target.value;
                    document.getElementById('sizeDisplay').textContent = e.target.value;
                });

                document.getElementById('penTool').addEventListener('click', () => this.setTool('pen'));
                document.getElementById('eraserTool').addEventListener('click', () => this.setTool('eraser'));
                document.getElementById('fillTool').addEventListener('click', () => this.setTool('fill'));
                document.getElementById('clearCanvas').addEventListener('click', () => this.clearCanvas());

                // Type/Status selection
                document.getElementById('typeSelect').addEventListener('change', (e) => {
                    const statusSection = document.getElementById('statusSection');
                    if (e.target.value === 'show') {
                        statusSection.style.display = 'block';
                    } else {
                        statusSection.style.display = 'none';
                    }
                });

                // Canvas drawing
                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', () => this.stopDrawing());
                this.canvas.addEventListener('mouseout', () => this.stopDrawing());

                // Touch events for mobile
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const mouseEvent = new MouseEvent('mouseup', {});
                    this.canvas.dispatchEvent(mouseEvent);
                });

                // Close modal when clicking outside
                window.addEventListener('click', (e) => {
                    const modal = document.getElementById('showModal');
                    if (e.target === modal) {
                        this.closeModal();
                    }
                });
            }

            setTool(tool) {
                this.currentTool = tool;
                document.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('active'));
                document.getElementById(tool + 'Tool').classList.add('active');
                
                if (tool === 'fill') {
                    this.canvas.style.cursor = 'pointer';
                } else {
                    this.canvas.style.cursor = 'crosshair';
                }
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            startDrawing(e) {
                const pos = this.getMousePos(e);
                
                if (this.currentTool === 'fill') {
                    this.floodFill(pos.x, pos.y, this.currentColor);
                    return;
                }
                
                this.isDrawing = true;
                this.ctx.beginPath();
                this.ctx.moveTo(pos.x, pos.y);
            }

            draw(e) {
                if (!this.isDrawing || this.currentTool === 'fill') return;
                
                const pos = this.getMousePos(e);
                
                if (this.currentTool === 'eraser') {
                    this.ctx.globalCompositeOperation = 'destination-out';
                } else {
                    this.ctx.globalCompositeOperation = 'source-over';
                    this.ctx.strokeStyle = this.currentColor;
                }
                
                this.ctx.lineWidth = this.currentSize;
                this.ctx.lineCap = 'round';
                this.ctx.lineTo(pos.x, pos.y);
                this.ctx.stroke();
                this.ctx.beginPath();
                this.ctx.moveTo(pos.x, pos.y);
            }

            stopDrawing() {
                this.isDrawing = false;
                this.ctx.beginPath();
            }

            floodFill(x, y, fillColor) {
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const data = imageData.data;
                
                const startPos = (Math.floor(y) * this.canvas.width + Math.floor(x)) * 4;
                const startR = data[startPos];
                const startG = data[startPos + 1];
                const startB = data[startPos + 2];
                
                const fillR = parseInt(fillColor.slice(1, 3), 16);
                const fillG = parseInt(fillColor.slice(3, 5), 16);
                const fillB = parseInt(fillColor.slice(5, 7), 16);
                
                if (startR === fillR && startG === fillG && startB === fillB) return;
                
                const stack = [[Math.floor(x), Math.floor(y)]];
                
                while (stack.length > 0) {
                    const [currentX, currentY] = stack.pop();
                    
                    if (currentX < 0 || currentX >= this.canvas.width || 
                        currentY < 0 || currentY >= this.canvas.height) continue;
                    
                    const pos = (currentY * this.canvas.width + currentX) * 4;
                    
                    if (data[pos] !== startR || data[pos + 1] !== startG || 
                        data[pos + 2] !== startB) continue;
                    
                    data[pos] = fillR;
                    data[pos + 1] = fillG;
                    data[pos + 2] = fillB;
                    data[pos + 3] = 255;
                    
                    stack.push([currentX + 1, currentY]);
                    stack.push([currentX - 1, currentY]);
                    stack.push([currentX, currentY + 1]);
                    stack.push([currentX, currentY - 1]);
                }
                
                this.ctx.putImageData(imageData, 0, 0);
            }

            clearCanvas() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            openModal(showIndex = -1) {
                this.currentShowIndex = showIndex;
                const modal = document.getElementById('showModal');
                const modalTitle = document.getElementById('modalTitle');
                const showNameInput = document.getElementById('showName');
                const typeSelect = document.getElementById('typeSelect');
                const statusSelect = document.getElementById('statusSelect');
                const statusSection = document.getElementById('statusSection');
                const description = document.getElementById('description');
                
                if (showIndex >= 0) {
                    modalTitle.textContent = 'Edit Show/Movie';
                    const show = this.shows[showIndex];
                    showNameInput.value = show.name;
                    typeSelect.value = show.type || 'movie';
                    statusSelect.value = show.status || 'ongoing';
                    description.value = show.description || '';
                    
                    // Show/hide status section based on type
                    statusSection.style.display = show.type === 'show' ? 'block' : 'none';
                    
                    // Load existing drawing
                    const img = new Image();
                    img.onload = () => {
                        this.clearCanvas();
                        this.ctx.drawImage(img, 0, 0);
                    };
                    img.src = show.drawing;
                } else {
                    modalTitle.textContent = 'Add New Show/Movie';
                    showNameInput.value = '';
                    typeSelect.value = 'movie';
                    statusSelect.value = 'ongoing';
                    description.value = '';
                    statusSection.style.display = 'none';
                    this.clearCanvas();
                }
                
                modal.style.display = 'block';
                setTimeout(() => showNameInput.focus(), 100);
            }

            closeModal() {
                document.getElementById('showModal').style.display = 'none';
            }

            saveShow() {
                const showName = document.getElementById('showName').value.trim();
                const type = document.getElementById('typeSelect').value;
                const status = document.getElementById('statusSelect').value;
                const description = document.getElementById('description').value.trim();
                
                if (!showName) {
                    alert('Please enter a show/movie name!');
                    return;
                }
                
                const drawingData = this.canvas.toDataURL();
                
                const showData = {
                    name: showName,
                    type: type,
                    description: description,
                    drawing: drawingData
                };
                
                if (type === 'show') {
                    showData.status = status;
                }
                
                if (this.currentShowIndex >= 0) {
                    // Edit existing show
                    this.shows[this.currentShowIndex] = showData;
                } else {
                    // Add new show
                    this.shows.push(showData);
                }
                
                this.saveShows();
                this.updateDisplay();
                this.closeModal();
            }

            deleteShow(index) {
                if (confirm(`Are you sure you want to delete "${this.shows[index].name}"?`)) {
                    this.shows.splice(index, 1);
                    this.saveShows();
                    this.updateDisplay();
                }
            }

            updateDisplay() {
                const watchlist = document.getElementById('watchlist');
                const emptyState = document.getElementById('emptyState');
                
                if (this.shows.length === 0) {
                    watchlist.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }
                
                watchlist.style.display = 'grid';
                emptyState.style.display = 'none';
                
                watchlist.innerHTML = this.shows.map((show, index) => {
                    let subtitle = show.type === 'movie' ? '🎬 Movie' : '📺 Show';
                    if (show.type === 'show' && show.status) {
                        subtitle += ` • ${show.status.charAt(0).toUpperCase() + show.status.slice(1)}`;
                    }
                    
                    return `
                    <div class="show-card">
                        <div class="show-title">${show.name}</div>
                        <div style="color: #718096; font-size: 0.9em; margin-bottom: 10px;">${subtitle}</div>
                        ${show.description ? `<div style="color: #4a5568; font-size: 0.9em; margin-bottom: 15px; font-style: italic;">"${show.description}"</div>` : ''}
                        <div class="drawing-preview" onclick="watchlistApp.openModal(${index})">
                            <img src="${show.drawing}" alt="Drawing for ${show.name}" style="max-width: 100%; max-height: 100%; border-radius: 8px;" />
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <button class="edit-btn" onclick="watchlistApp.openModal(${index})">Edit Drawing</button>
                            <button class="edit-btn" style="background: #f56565;" onclick="watchlistApp.deleteShow(${index})">Delete</button>
                        </div>
                    </div>
                `;
                }).join('');
            }

            // Load shows from blob storage
            async loadShowsFromBlob() {
                try {
                    const response = await fetch('/api/data-manager?operation=load&dataType=watched');
                    if (response.ok) {
                        const data = await response.json();
                        this.shows = data.data || [];
                        console.log(`Loaded ${this.shows.length} shows from blob storage`);
                    } else {
                        console.log('Failed to load shows from blob storage, trying localStorage');
                        this.loadShowsFromLocalStorage();
                    }
                } catch (error) {
                    console.error('Error loading shows from blob storage:', error);
                    this.loadShowsFromLocalStorage();
                }
            }

            // Save shows to blob storage
            async saveShowsToBlob() {
                try {
                    const response = await fetch('/api/data-manager?operation=save&dataType=watched', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            data: this.shows
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to save shows');
                    }

                    const result = await response.json();
                    console.log('Shows saved successfully to blob storage! Total shows:', result.totalItems);
                } catch (error) {
                    console.error('Error saving shows to blob storage:', error);
                    // Fallback to localStorage
                    this.saveShowsToLocalStorage();
                }
            }

            saveShows() {
                // Save to both blob storage and localStorage as backup
                this.saveShowsToBlob();
                this.saveShowsToLocalStorage();
            }

            saveShowsToLocalStorage() {
                try {
                    localStorage.setItem('watchlist', JSON.stringify(this.shows));
                } catch (e) {
                    console.log('Could not save to localStorage');
                }
            }

            loadShowsFromLocalStorage() {
                try {
                    const saved = localStorage.getItem('watchlist');
                    if (saved) {
                        this.shows = JSON.parse(saved);
                    }
                } catch (e) {
                    console.log('Could not load from localStorage');
                    this.shows = [];
                }
            }
        }

        // Initialize the app
        const watchlistApp = new WatchlistApp();
    </script>
</body>
</html>
