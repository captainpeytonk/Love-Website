<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Love Timeline</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fff0f5;
      color: #333;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #d63384;
      margin-bottom: 1rem;
      text-align: center;
    }
    #addButton {
      font-size: 4rem;
      color: #d63384;
      cursor: pointer;
      user-select: none;
      border: 3px dashed #d63384;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
      transition: background 0.3s ease;
    }
    #addButton:hover {
      background: #f8d7e4;
    }
    #eventForm {
      background: #fff;
      border: 2px solid #d63384;
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      max-width: 400px;
      width: 100%;
      margin-bottom: 2rem;
      display: none;
      flex-direction: column;
    }
    #eventForm input[type="text"],
    #eventForm input[type="date"] {
      font-size: 1rem;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }
    #eventForm button {
      background: #d63384;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.7rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #eventForm button:disabled {
      background: #eaa6c0;
      cursor: default;
    }
    .event-month-group {
      margin-bottom: 2rem;
    }
    .event-month-header {
      font-weight: bold;
      color: #d63384;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    .event-card {
      position: relative;
      background: #fff;
      border: 2px solid #d63384;
      border-radius: 1rem;
      padding: 1rem 1.5rem 1.5rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      text-align: center;
    }
    .event-info {
      margin-bottom: 0.5rem;
    }
    .event-name {
      font-weight: bold;
      color: #d63384;
      margin-bottom: 0.3rem;
      font-size: 1.2rem;
    }
    .event-date {
      font-size: 1rem;
      color: #666;
    }
    .event-timer {
      font-size: 1rem;
      margin-top: 0.7rem;
      color: #555;
    }
    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      color: #d63384;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
      line-height: 1;
      padding: 0;
    }
    .delete-btn:hover {
      color: #a02862;
    }
    .sidebar-link {
      cursor: pointer;
      color: #555;
      margin: 0.2rem 0;
      padding: 2px 6px;
      border-radius: 4px;
      display: block;
      font-size: 0.9rem;
      text-align: right;
    }
    .sidebar-link:hover {
      background-color: #ffe0ef;
      color: #d63384;
    }
    .scroll-gallery {
  position: fixed;
  width: 100px;
  height: 100%;
  overflow: hidden;
  z-index: 0;
  top: 0;
}

.scroll-gallery.left {
  left: 0;
}

.scroll-gallery.right {
  right: 0;
}

.scroll-gallery img {
  width: 100px;
  height: auto;
  display: block;
  margin-bottom: 10px;
  animation: scrollUp 20s linear infinite;
}

@keyframes scrollUp {
  0% { transform: translateY(100%); }
  100% { transform: translateY(-100%); }
}
    .timeline-container {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      gap: 2rem;
    }
    #eventsList {
      flex: 3;
      padding-right: 1rem;
    }
    #sidebar {
      flex: 1;
      max-width: 150px;
      position: sticky;
      top: 1rem;
      align-self: flex-start;
    }
  </style>
</head>
  
<body>

  <h1>💕 Our Love Timeline</h1>
  <div id="addButton" title="Add a new event">＋</div>

  <form id="eventForm" aria-label="Add a new event">
    <input type="text" id="eventName" placeholder="Event name (e.g. 'Together Since')" required />
    <input type="text" id="eventDate" placeholder="DD/MM/YYYY" required />
    <button type="submit" disabled>Add Event</button>
  </form>

  <div class="timeline-container">
    <div id="eventsList"></div>
    <div id="sidebar"></div>
  </div>

  <script>
    const addButton = document.getElementById('addButton');
    const eventForm = document.getElementById('eventForm');
    const eventNameInput = document.getElementById('eventName');
    const eventDateInput = document.getElementById('eventDate');
    const submitBtn = eventForm.querySelector('button');
    const eventsList = document.getElementById('eventsList');
    let events = [];

    // Initialize Flatpickr
    flatpickr(eventDateInput, {
      dateFormat: "d/m/Y",
      allowInput: true
    });

    addButton.addEventListener('click', () => {
      addButton.style.display = 'none';
      eventForm.style.display = 'flex';
      eventNameInput.focus();
    });

    function checkInputs() {
      submitBtn.disabled = !(eventNameInput.value.trim() && eventDateInput.value);
    }

    eventNameInput.addEventListener('input', checkInputs);
    eventDateInput.addEventListener('input', checkInputs);

    function parseDateDMY(dateStr) {
      const [day, month, year] = dateStr.split('/').map(Number);
      return new Date(year, month - 1, day);
    }

    function formatDateDMY(dateObj) {
      const day = String(dateObj.getDate()).padStart(2,'0');
      const month = String(dateObj.getMonth() + 1).padStart(2,'0');
      const year = dateObj.getFullYear();
      return `${day}/${month}/${year}`;
    }

    eventForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = eventNameInput.value.trim();
      const dateStr = eventDateInput.value;
      if (!name || !dateStr) return;

      const date = parseDateDMY(dateStr).toISOString().split('T')[0]; // store as YYYY-MM-DD
      events.push({ name, date });

      eventNameInput.value = '';
      eventDateInput.value = '';
      submitBtn.disabled = true;
      eventForm.style.display = 'none';
      addButton.style.display = 'flex';
      renderEvents();
    });

    function deleteEvent(index) {
      events.splice(index, 1);
      renderEvents();
    }

    function renderEvents() {
      eventsList.innerHTML = '';
      document.getElementById('sidebar').innerHTML = '';
      if (events.length === 0) return;

      const sortedEvents = [...events].sort((a,b)=>new Date(a.date)-new Date(b.date));
      const grouped = {};
      sortedEvents.forEach(event=>{
        const date = new Date(event.date);
        const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
        if(!grouped[key]) grouped[key]=[];
        grouped[key].push(event);
      });

      const sidebar = document.getElementById('sidebar');
      Object.keys(grouped).sort((a,b)=>{
        const [y1,m1]=a.split('-').map(Number);
        const [y2,m2]=b.split('-').map(Number);
        return new Date(y1,m1-1)-new Date(y2,m2-1);
      }).forEach(key=>{
        const [year, month]=key.split('-');
        const monthName = new Date(`${year}-${month}-01`).toLocaleString('default',{month:'short'});
        const link = document.createElement('div');
        link.className='sidebar-link';
        link.textContent=`${monthName} ${year}`;
        link.addEventListener('click',()=>document.getElementById(`month-${key}`).scrollIntoView({behavior:'smooth'}));
        sidebar.appendChild(link);
      });

      Object.keys(grouped).sort((a,b)=>{
        const [y1,m1]=a.split('-').map(Number);
        const [y2,m2]=b.split('-').map(Number);
        return new Date(y1,m1-1)-new Date(y2,m2-1);
      }).forEach(key=>{
        const [year, month]=key.split('-');
        const groupDiv=document.createElement('div');
        groupDiv.className='event-month-group';
        groupDiv.id=`month-${key}`;

        const header=document.createElement('div');
        header.className='event-month-header';
        const monthName=new Date(`${year}-${month}-01`).toLocaleString('default',{month:'long'});
        header.textContent=`${monthName} ${year}`;
        groupDiv.appendChild(header);

        grouped[key].forEach(event=>{
          const card=document.createElement('div');
          card.className='event-card';
          const info=document.createElement('div');
          info.className='event-info';

          const nameDiv=document.createElement('div');
          nameDiv.className='event-name';
          nameDiv.textContent=event.name;

          const dateDiv=document.createElement('div');
          dateDiv.className='event-date';
          dateDiv.textContent=formatDateDMY(new Date(event.date));

          const timerDiv=document.createElement('div');
          timerDiv.className='event-timer';
          timerDiv.id=`timer-${event.name}-${event.date}`;

          info.appendChild(nameDiv);
          info.appendChild(dateDiv);
          info.appendChild(timerDiv);

          const delBtn=document.createElement('button');
          delBtn.className='delete-btn';
          delBtn.innerHTML='🗑️';
          delBtn.title='Delete event';
          delBtn.addEventListener('click',()=>{
            const indexToDelete=events.findIndex(e=>e.name===event.name && e.date===event.date);
            if(indexToDelete!==-1) deleteEvent(indexToDelete);
          });

          card.appendChild(info);
          card.appendChild(delBtn);
          groupDiv.appendChild(card);
        });

        eventsList.appendChild(groupDiv);
      });

      updateTimers();
    }

    function updateTimers() {
      const now=new Date();
      events.forEach(event=>{
        const eventDate=new Date(event.date+"T00:00:00");
        let diff=now-eventDate;
        if(diff<0) diff=0;

        let totalSeconds=Math.floor(diff/1000);
        const seconds=totalSeconds%60;
        const totalMinutes=Math.floor(totalSeconds/60);
        const minutes=totalMinutes%60;
        const totalHours=Math.floor(totalMinutes/60);
        const hours=totalHours%24;
        const totalDays=Math.floor(totalHours/24);

        const years=Math.floor(totalDays/365.25);
        const months=Math.floor((totalDays%365.25)/30.44);
        const days=Math.floor((totalDays%365.25)%30.44);

        const text=`⏳ ${years} Years ${months} Months ${days} Days ${hours} Hours ${minutes} Minutes ${seconds} Seconds`;
        const timerEl=document.getElementById(`timer-${event.name}-${event.date}`);
        if(timerEl) timerEl.textContent=text;
      });
    }

    setInterval(updateTimers,1000);

    function loadScrollGalleries() {
      const leftGallery=document.getElementById('leftGallery');
      const rightGallery=document.getElementById('rightGallery');
      const leftImages=JSON.parse(localStorage.getItem("loveGalleryBucket")||"[]");
      const rightImages=JSON.parse(localStorage.getItem("loveGalleryMap")||"[]");
      leftImages.forEach(url=>{ const img=document.createElement('img'); img.src=url; leftGallery.appendChild(img); });
      rightImages.forEach(url=>{ const img=document.createElement('img'); img.src=url; rightGallery.appendChild(img); });
    }
    window.addEventListener("load", loadScrollGalleries);
  </script>
</body>
</html>
