<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Bus Website</title>
  <style>
    /* Make the background image cover the whole screen */
    body {
      margin: 0;
      height: 100vh;
      background: url("Anniversary/Love background.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* Bus styling */
#love-bus {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 100px;
  bottom: 200px;
}
#love-alex {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 500px;
  bottom: 200px;
}
#love-tara {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 800px;
  bottom: 200px;
}
    #love-duck {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 1200px;
  bottom: 200px;
}
   #love-Jeffrey {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 1400px;
  bottom: 100px;
}
     #love-birds {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 50px;
  bottom: 50px;
}  
         #love-bat {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 50px;
  bottom: 500px;
}  
         #love-castle {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 150px;
  bottom: 500px;
}  
    
    /* Shake animation */
    @keyframes shakeUp {
      0% { transform: translateY(0); }
      25% { transform: translateY(-15px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    .shake {
      animation: shakeUp 0.6s ease;
    }
  </style>
</head>
<body>
  <!-- Love Bus -->
  <img id="love-bus" src="Anniversary/Love Bus.png" alt="Love Bus">
  <img id="love-alex" src="Anniversary/Love Alex.png" alt="Love Alex">
  <img id="love-duck" src="Anniversary/Love Duck.png" alt="Love Duck">
  <img id="love-jeffrey" src="Anniversary/Love Jeffrey.png" alt="Love Jeffrey">
  <img id="love-tara" src="Anniversary/Love Tara.png" alt="Love Tara">
  <img id="love-birds" src="Anniversary/Love birds.png" alt="Love Birds">
  <img id="love-bat" src="Anniversary/Love bat.png" alt="Love Bat">
  <img id="love-castle" src="Anniversary/Love castle.png" alt="Love Castle">

  <!-- Sound -->
  <audio id="bus-sound" src="Anniversary/sound.mp3"></audio>

  <script>
    const bus = document.getElementById("love-bus");
    const sound = document.getElementById("bus-sound");

    bus.addEventListener("click", () => {
      // Play sound
      sound.currentTime = 0;
      sound.play();

      // Add shake animation
      bus.classList.add("shake");

      // Remove shake class after animation finishes
      setTimeout(() => {
        bus.classList.remove("shake");
      }, 600);
    });
  </script>
</body>
</html>
