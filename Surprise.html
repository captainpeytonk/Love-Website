<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Bus Website</title>
  <style>
    /* Make the background image cover the whole screen */
    body {
      margin: 0;
      height: 100vh;
      background: url("Anniversary/Love background.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* Bus styling */
#love-bus {
  height: auto;
  width: 20vw;
  cursor: pointer;
  position: absolute;
  right: 100px;
  bottom: 200px;
}
#love-alex {
  height: auto;
  width: 17vw;
  cursor: pointer;
  position: absolute;
  right: 475px;
  bottom: 70px;
}
#love-tara {
  height: auto;
  width: 19vw;
  cursor: pointer;
  position: absolute;
  right: 725px;
  bottom: 70px;
}
    #love-duck {
  height: auto;
  width: 10vw;
  cursor: pointer;
  position: absolute;
  right: 1020px;
  bottom: 200px;
}
   #love-Jeffrey {
  height: auto;
  width: 10vw;
  cursor: pointer;
  position: absolute;
  right: 1350px;
  bottom: 100px;
}
     #love-birds {
  height: auto;
  width: 10vw;
  cursor: pointer;
  position: absolute;
  right: 50px;
  bottom: 50px;
}  
         #love-bat {
  height: auto;
  width: 10vw;
  cursor: pointer;
  position: absolute;
  right: 50px;
  bottom: 500px;
}  
         #love-castle {
  height: auto;
  width: 10vw;
  cursor: pointer;
  position: absolute;
  right: 200px;
  bottom: 440px;
}  
    
    /* Shake animation */
    @keyframes shakeUp {
      0% { transform: translateY(0); }
      25% { transform: translateY(-15px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    .shake {
      animation: shakeUp 0.6s ease;
    }
/* Popup hearts style */
#hearts-popup {
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 25vw;
  z-index: 9999;
}

/* Left-right shake animation */
@keyframes shakeSide {
  0% { transform: translate(-50%, -50%) translateX(0); }
  25% { transform: translate(-50%, -50%) translateX(-15px); }
  50% { transform: translate(-50%, -50%) translateX(15px); }
  75% { transform: translate(-50%, -50%) translateX(-8px); }
  100% { transform: translate(-50%, -50%) translateX(0); }
}

.shake-side {
  animation: shakeSide 0.6s ease infinite;
}

#heart-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
  z-index: 9998;
}

.heart {
  position: absolute;
  bottom: 0; /* start from bottom */
  font-size: 1.5rem;
  color: red;
  animation-name: floatUp;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

/* Floating hearts animation with random horizontal and rotation movement */
@keyframes floatUp {
  0% {
    transform: translateX(0px) translateY(0px) rotate(0deg);
    opacity: 1;
  }
  25% {
    transform: translateX(var(--x1)) translateY(-25vh) rotate(var(--r1));
  }
  50% {
    transform: translateX(var(--x2)) translateY(-50vh) rotate(var(--r2));
  }
  75% {
    transform: translateX(var(--x3)) translateY(-75vh) rotate(var(--r3));
  }
  100% {
    transform: translateX(var(--x4)) translateY(-120vh) rotate(var(--r4));
    opacity: 0;
  }
}
    
  </style>
</head>
<body>
<img id="love-bus" class="clickable" data-sound="Anniversary/bus.mp3" src="Anniversary/Love Bus.png" alt="Love Bus">
<img id="love-alex" class="clickable" data-sound="Anniversary/alex.mp3" src="Anniversary/Love Alex.png" alt="Love Alex">
<img id="love-duck" class="clickable" data-sound="Anniversary/duck.mp3" src="Anniversary/Love Duck.png" alt="Love Duck">
<img id="love-Jeffrey" class="clickable" data-sound="Anniversary/jeffrey.mp3" src="Anniversary/Love Jeffrey.png" alt="Love Jeffrey">
<img id="love-tara" class="clickable" data-sound="Anniversary/tara.mp3" src="Anniversary/Love Tara.png" alt="Love Tara">
<img id="love-birds" class="clickable" data-sound="Anniversary/birds.mp3" src="Anniversary/Love birds.png" alt="Love Birds">
<img id="love-bat" class="clickable" data-sound="Anniversary/bat.mp3" src="Anniversary/Love bat.png" alt="Love Bat">
<img id="love-castle" class="clickable" data-sound="Anniversary/castle.mp3" src="Anniversary/Love castle.png" alt="Love Castle">
  <img id="hearts-popup" src="Anniversary/hearts.png" alt="Hearts" style="display: none;">
<div id="heart-container"></div>

<script>
const clickableImages = document.querySelectorAll(".clickable");
const heartsPopup = document.getElementById("hearts-popup");
const heartContainer = document.getElementById("heart-container");

clickableImages.forEach(img => {
  img.addEventListener("click", () => {
    // Play audio
    const sound = new Audio(img.dataset.sound);
    sound.currentTime = 0;
    sound.play();

    // Shake clicked image
    img.classList.add("shake");
    setTimeout(() => img.classList.remove("shake"), 600);

if (img.id === "love-alex") {
  // Show central hearts.png
  heartsPopup.style.display = "block";
  heartsPopup.classList.add("shake-side");

  sound.addEventListener("ended", () => {
    heartsPopup.style.display = "none";
    heartsPopup.classList.remove("shake-side");
  });

  // Generate 100 floating hearts
  for (let i = 0; i < 100; i++) {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.textContent = "❤️";

    // Randomize horizontal movement (CSS variables)
    heart.style.setProperty("--x1", `${(Math.random() - 0.5) * 50}px`);
    heart.style.setProperty("--x2", `${(Math.random() - 0.5) * 50}px`);
    heart.style.setProperty("--x3", `${(Math.random() - 0.5) * 50}px`);
    heart.style.setProperty("--x4", `${(Math.random() - 0.5) * 50}px`);

    // Random rotation
    heart.style.setProperty("--r1", `${Math.random() * 30 - 15}deg`);
    heart.style.setProperty("--r2", `${Math.random() * 30 - 15}deg`);
    heart.style.setProperty("--r3", `${Math.random() * 30 - 15}deg`);
    heart.style.setProperty("--r4", `${Math.random() * 30 - 15}deg`);

    // Random animation duration
    const duration = 3 + Math.random() * 2; // 3–5 seconds
    heart.style.animationDuration = `${duration}s`;

    // Random starting horizontal position
    heart.style.left = `${Math.random() * 100}vw`;

    heartContainer.appendChild(heart);

    // Remove after animation ends
    heart.addEventListener("animationend", () => heart.remove());
  }
}  
});
});
</script>
</body>
</html>
